name: build dev addon
on:
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  build_dev:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gettext
          uv sync
      - name: Code checks
        # ruff check only (no --fix): linting must never rewrite files.
        # The vendored lib/model trees are excluded via pyproject.toml.
        run: uv run ruff check .
      - name: Build development add-on
        # scons dev=yes names the add-on after the current date
        # (yyyymmdd.0.0) and sets updateChannel to "dev" in the manifest.
        # The manifest is removed first because scons only regenerates it
        # when buildVars.py or the template change, not when the version
        # or channel variables change.
        run: |
          rm -f addon/manifest.ini
          uv run scons dev=yes
      - name: Upload development add-on
        uses: actions/upload-artifact@v7
        with:
          name: dev_addon
          path: ./*.nvda-addon
          archive: false
      - name: Publish development release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          addonFile=$(ls *.nvda-addon)
          echo "Publishing $addonFile to the 'dev' release"
          if gh release view dev >/dev/null 2>&1; then
            gh release upload dev "$addonFile" --clobber
          else
            gh release create dev "$addonFile" \
              --title "Development build" \
              --notes "Development build of ${{ github.ref_name }} @ ${{ github.sha }}. Not intended for general use."
          fi
          echo "Direct download URL:"
          echo "https://github.com/${{ github.repository }}/releases/download/dev/$addonFile"
